
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Membuka Ujian Online...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      color: #0f172a;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 12px;
      color: #1d4ed8;
      font-size: 25px;
    }

    p {
      color: #64748b;
      line-height: 1.7;
      font-size: 15px;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 22px auto;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 24px;
      border-radius: 10px;
      background: #1d4ed8;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .btn:hover {
      background: #1e40af;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">📘</div>

    <h1>Ujian Online</h1>

    <p id="status">
      Anda akan diarahkan ke halaman ujian.
      Mohon tunggu sebentar...
    </p>

    <div class="loader" id="loader"></div>

    <a class="btn" id="openApp" href="#">
      Buka Ujian Sekarang →
    </a>

    <p class="note">
      Jika halaman tidak terbuka otomatis, tekan tombol di atas.
    </p>
  </main>

  <script>
    // URL aplikasi Google Apps Script
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbzK10OS2dhbI7s2B_mDyoLltAI9onBCDWTkgpnwFvO7ISrvshSy8mtIUtIrEbufK4O-9A/exec?page=play&id=3fd5849f6954";

    document.getElementById("openApp").href = APP_URL;

    // Alihkan langsung ke aplikasi ujian
    window.location.replace(APP_URL);
  </script>
</body>
</html>
